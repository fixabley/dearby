<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Dearby brand preview</title>
<style>
  @font-face { font-family: "Pretendard"; src: url("../fonts/pretendard/Pretendard-Bold.otf") format("opentype"); font-weight: 700; }
  body { margin: 0; font-family: Pretendard, "Apple SD Gothic Neo", sans-serif; color: #172027; }
  h1, h2 { margin: 24px 24px 8px; font-weight: 700; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 16px 24px; }
  .bg { border-radius: 16px; padding: 24px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 24px; }
  .white { background: #fff; border: 1px solid #E3E8EA; } .mint { background: #F0FCFA; } .teal { background: #007F80; }
  .teal img { filter: brightness(0) invert(1); }
  figure { margin: 0; text-align: center; font-size: 12px; color: #657078; } .teal figure { color: #F0FCFA; }
  .mark { padding: 24px; display: flex; align-items: center; gap: 32px; }
</style></head>
<body>
<h1>Dearby 심볼 — 악수를 추상화한 세 가지 안</h1>
<h2>A · 두 손이 만드는 D</h2><div class="row" id="a"></div>
<h2>B · 맞물린 두 고리</h2><div class="row" id="b"></div>
<h2>C · 건네는 두 명함</h2><div class="row" id="c"></div>
<h2>D · 맞잡은 두 손 (갈고리 걸쇠)</h2><div class="row" id="d"></div>
<h2>E · 악수 리본</h2><div class="row" id="e"></div>
<h2>워드마크</h2><div class="mark white"><img src="wordmark.svg" height="96" alt="Dearby"></div>
<script>
  for (const v of ["a","b","c","d","e"]) {
    const row = document.getElementById(v);
    for (const bg of ["white","mint","teal"]) {
      const box = document.createElement("div"); box.className = "bg " + bg;
      for (const size of [512,128,48,24]) {
        const f = document.createElement("figure");
        f.innerHTML = `<img src="symbol-${v}.svg" width="${size}" height="${size}" alt="symbol ${v}"><figcaption>${size}px</figcaption>`;
        box.appendChild(f);
      }
      row.appendChild(box);
    }
  }
</script>
</body></html>

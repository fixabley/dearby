<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 320" width="1320" height="320">
  <!-- Dearby wordmark: the linked-rings symbol + "Dearby" in Pretendard Bold, teal on transparent. Clear space around the lockup = one stroke width (58 units at this scale). -->
  <style>
    @font-face { font-family: "Pretendard"; src: url("../fonts/pretendard/Pretendard-Bold.otf") format("opentype"); font-weight: 700; }
    text { font-family: "Pretendard", "Apple SD Gothic Neo", "Helvetica Neue", Arial, sans-serif; font-weight: 700; }
  </style>
  <g transform="translate(0 -96)" fill="none" stroke="#007F80" stroke-width="58" stroke-linecap="round">
    <path d="M187 355 A100 100 0 1 1 296 278"/>
    <path d="M325 157 A100 100 0 1 1 216 235"/>
  </g>
  <text x="500" y="274" font-size="210" fill="#007F80" letter-spacing="-4">Dearby</text>
</svg>

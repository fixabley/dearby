<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(../fonts/pretendard/Pretendard-Bold.otf);font-weight:700}
html,body{margin:0;width:1024px;height:500px;overflow:hidden;background:#007F80}
svg{display:block}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
<rect width="1024" height="500" fill="#007F80"/>
<!-- Play 그래픽 이미지(1024×500): 청록 바탕에 흰 워드마크를 가운데. 헤드리스 Chrome으로 그린다(README "다시 뽑을 때"). 글꼴은 ../fonts/pretendard/Pretendard-Bold.otf. -->
<g id="lockup" transform="translate(150 162) scale(0.55)">
 <g transform="translate(0 -96)" fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round">
  <path d="M187 355 A100 100 0 1 1 296 278"/><path d="M325 157 A100 100 0 1 1 216 235"/>
 </g>
 <text x="500" y="274" font-size="210" fill="#FFFFFF" letter-spacing="-4" style="font-family:P;font-weight:700">Dearby</text>
</g></svg>
<script>document.fonts.ready.then(()=>{const b=document.getElementById('lockup').getBBox();const s=0.55,w=b.width*s,h=b.height*s;document.getElementById('lockup').setAttribute('transform',`translate(${(1024-w)/2-b.x*s} ${(500-h)/2-b.y*s}) scale(${s})`)})</script>
</body></html>

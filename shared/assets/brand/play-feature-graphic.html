<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(../fonts/pretendard/Pretendard-Bold.otf);font-weight:700}
@font-face{font-family:PS;src:url(../fonts/pretendard/Pretendard-SemiBold.otf);font-weight:600}
html,body{margin:0;width:1024px;height:500px;overflow:hidden;background:#007F80}
svg{display:block}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
<rect width="1024" height="500" fill="#007F80"/>
<!-- Play 그래픽 이미지(1024×500): 청록 바탕에 흰 워드마크와 한 줄 문구를 가운데. 헤드리스 Chrome으로 그린다(README "다시 뽑을 때"). -->
<g id="all">
<g id="lockup" transform="scale(0.5)">
 <g transform="translate(0 -96)" fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round">
  <path d="M187 355 A100 100 0 1 1 296 278"/><path d="M325 157 A100 100 0 1 1 216 235"/>
 </g>
 <text x="500" y="274" font-size="210" fill="#FFFFFF" letter-spacing="-4" style="font-family:P;font-weight:700">Dearby</text>
</g>
<text id="tag" font-size="40" fill="#F0FCFA" text-anchor="middle" letter-spacing="-0.5" style="font-family:PS;font-weight:600">대외활동, 매일 맞춤으로</text>
</g></svg>
<script>document.fonts.ready.then(()=>{const L=document.getElementById('lockup'),T=document.getElementById('tag');const b=L.getBBox(),s=0.5,w=b.width*s,h=b.height*s,gap=34,th=40;const top=(500-(h+gap+th))/2;L.setAttribute('transform',`translate(${(1024-w)/2-b.x*s} ${top-b.y*s}) scale(${s})`);T.setAttribute('x',512);T.setAttribute('y',top+h+gap+th*0.82)})</script>
</body></html>

ssl_certificate /etc/nginx/certs/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name wid.io.kr;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://wid.io.kr$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.dearby.wid.io.kr;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://api.dearby.wid.io.kr$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name wid.io.kr;

    # Same public API surface as api.dearby.wid.io.kr during the transition.
    include /etc/nginx/conf.d/dearby-api/api.locations.conf;

    # 패스키 RP ID(wid.io.kr) 앱 연결 파일. 내용은 ./html/.well-known/ 정적 파일
    location = /.well-known/apple-app-site-association {
        root /usr/share/nginx/html;
        default_type application/json;
    }
    location = /.well-known/assetlinks.json {
        root /usr/share/nginx/html;
        default_type application/json;
    }

    location / {
        default_type text/plain;
        return 200 "wid.io.kr\n";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # The http-level certificate must list this name as a SAN before this block serves clients.
    server_name api.dearby.wid.io.kr;

    # Kotlin API (dearby-api-prod, ~/.dearby-deploy/api-kotlin-*). 인증·권한은 API가 판단한다
    location / {
        proxy_pass http://host.docker.internal:58866;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 1m;
    }
}

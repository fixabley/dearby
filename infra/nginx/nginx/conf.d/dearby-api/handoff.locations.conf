# STAGE 2 (after the PR #110 API image is deployed): guest home-screen handoff.
# Included from api.locations.conf; guest headers are handled exactly like the other guest paths.
# The code travels only in the POST body (redeem) or response (issue); access logs stay off.
location ~ "^/v1/guest/handoffs(?:/redeem)?$" {
    if ($request_method != POST) { return 405; }
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://host.docker.internal:58865;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Guest-Proxy-Key $http_x_guest_proxy_key;
    proxy_set_header X-Guest-Token $http_x_guest_token;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
}

name: Capstone presentation Pages

on:
  push:
    branches: [main, feat/capstone-presentation]
    paths:
      - 'docs/presentations/capstone/**'
      - '.github/workflows/presentation-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capstone-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/presentations/capstone
      - name: Deploy presentation
        id: deployment
        uses: actions/deploy-pages@v5

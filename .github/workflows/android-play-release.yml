name: Android Play release
# Builds the upload-key-signed release AAB and sends it with the ko-KR listing (apps/android/fastlane/metadata/android)
# to a Play track. Play access: Workload Identity Federation (vars GCP_WIF_PROVIDER, PLAY_SERVICE_ACCOUNT). A release on `production` is Google's review submission;
# `internal` reaches internal testers only; `closed` is the closed-testing track named by var PLAY_CLOSED_TRACK (Play's default closed track is `alpha`).
# A push to `main` (the dev→main batch merge, 1–2 a day; user decision 2026-10-27) releases to the closed track with status completed.
on:
  push:
    branches: [main]
    paths: [apps/android/**, .github/workflows/android-play-release.yml]
  workflow_dispatch:
    inputs:
      track:
        description: Play track (closed = var PLAY_CLOSED_TRACK, default alpha)
        type: choice
        options: [internal, closed, production]
        default: internal
      release_notes:
        description: 이번 버전의 새로운 기능 (empty = changelogs/default.txt)
        type: string
        default: ""
      status:
        description: Release status (an app never published on Play accepts only draft)
        type: choice
        options: [completed, draft]
        default: completed
# id-token: Play access through Workload Identity Federation; the org forbids service-account keys. actions: the gate reads run history.
permissions:
  contents: read
  id-token: write
  actions: read
# Play edits are transactional, so runs never overlap or cancel each other; a main push waits behind a manual run.
concurrency:
  group: android-play-release
  cancel-in-progress: false
jobs:
  # A main push whose Android inputs match the last successful push run is skipped (safety net behind `on.push.paths`; manual runs always build).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != push ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android-play-release.yml --event push --branch "$GITHUB_REF_NAME" --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null \
            || git diff --name-only "$last" HEAD | grep -qE '^(apps/android/|\.github/workflows/android-play-release\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Android changes since $last; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi
  release:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Origins come from repository variables; signing and Play credentials from repository secrets. Nothing lives in the repo.
      DEARBY_API_ORIGIN: ${{ vars.DEARBY_API_ORIGIN }}
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
      # 맞춤 대기열 끝 광고: AdMob ids (not secret; both or the release shows no ad).
      ADMOB_ANDROID_APP_ID: ${{ vars.ADMOB_ANDROID_APP_ID }}
      ADMOB_ANDROID_QUEUE_NATIVE_UNIT_ID: ${{ vars.ADMOB_ANDROID_QUEUE_NATIVE_UNIT_ID }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # A push has no inputs: closed track, completed.
      PLAY_TRACK: ${{ (github.event_name == 'push' || inputs.track == 'closed') && (vars.PLAY_CLOSED_TRACK || 'alpha') || inputs.track }}
      PLAY_RELEASE_STATUS: ${{ github.event_name == 'push' && 'completed' || inputs.status }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/android
      - name: Check configuration
        env:
          UPLOAD_JKS: ${{ secrets.ANDROID_UPLOAD_JKS_BASE64 }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
        run: |
          for v in DEARBY_API_ORIGIN UPLOAD_JKS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GCP_WIF_PROVIDER PLAY_SERVICE_ACCOUNT; do
            test -n "${!v}" || { echo "::error::Missing $v (repository secret or variable; see docs/store/release-cd.md)."; exit 1; }
          done
      # Writes an external_account credentials file (short-lived, no key) that fastlane supply accepts as json_key.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Install signing material
        env:
          UPLOAD_JKS: ${{ secrets.ANDROID_UPLOAD_JKS_BASE64 }}
          PLAY_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          # The Google button is hidden without it; warn instead of failing so a build without Google sign-in stays possible.
          test -n "$GOOGLE_SERVER_CLIENT_ID" || echo "::warning::GOOGLE_SERVER_CLIENT_ID is empty; the release hides Google sign-in."
          test -n "$ADMOB_ANDROID_APP_ID" -a -n "$ADMOB_ANDROID_QUEUE_NATIVE_UNIT_ID" || echo "::warning::ADMOB_ANDROID_APP_ID or ADMOB_ANDROID_QUEUE_NATIVE_UNIT_ID is empty; the release shows no queue ad."
          printf '%s' "$UPLOAD_JKS" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          # Version code: monotonic above the manual first upload (1); a re-run of the same run reuses it and Play refuses the duplicate
          # (start a new run with `gh workflow run` instead; docs/store/release-cd.md).
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks"
            echo "PLAY_JSON_KEY_PATH=$PLAY_CREDENTIALS"
            echo "ANDROID_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))"
          } >> "$GITHUB_ENV"
          if [ -n "$RELEASE_NOTES" ]; then printf '%s\n' "$RELEASE_NOTES" > fastlane/metadata/android/ko-KR/changelogs/default.txt; fi
      # 새 모집 푸시: Firebase config from the optional secret ANDROID_GOOGLE_SERVICES_JSON (file content); without it the release has no push.
      - name: Write google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
      - name: Build release AAB
        run: |
          ./gradlew bundleRelease
          aab=app/build/outputs/bundle/release/app-release.aab
          # Unsigned means the four signing values did not all reach Gradle; Play would refuse it anyway.
          jarsigner -verify "$aab" | grep -q "jar verified" || { echo "AAB is not signed"; exit 1; }
          echo "AAB_PATH=$PWD/$aab" >> "$GITHUB_ENV"
          echo "versionCode $ANDROID_VERSION_CODE → $PLAY_TRACK ($PLAY_RELEASE_STATUS)" >> "$GITHUB_STEP_SUMMARY"
      # Kept for a manual upload in Play Console (the first release of an app, or when the API is refused).
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: ${{ env.AAB_PATH }}
          retention-days: 7
      - name: Upload to Play
        run: bundle exec fastlane android release
      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

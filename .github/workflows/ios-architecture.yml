name: iOS architecture

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-architecture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: iOS architecture
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Report toolchain
        run: |
          xcrun swift --version
          python3 --version
      - name: Validate iOS architecture
        run: bash apps/ios/tests/run_architecture.sh
      - name: Verify favorites and persistent caches
        run: bash apps/ios/tests/run_standalone.sh
      - name: Verify calendar consent and overlap behavior
        run: bash apps/ios/tests/run_busy_calendar.sh
      - name: Verify schedule presentation and timeline
        run: bash apps/ios/tests/run_detail_presentations.sh

  simulator-build:
    name: iOS simulator build
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Report app toolchain
        run: xcodebuild -version
      - name: Build iOS app for Simulator
        run: >-
          xcodebuild -project apps/ios/Dearby.xcodeproj
          -scheme Dearby -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath apps/ios/build/CI-DoNotCommit
          CODE_SIGNING_ALLOWED=NO build

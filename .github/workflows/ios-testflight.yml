name: iOS TestFlight
# Archives a signed Release and uploads it to TestFlight. A push to `main` (the dev→main batch merge, 1–2 a day; user decision 2026-10-27)
# also adds the processed build to the external TestFlight group and submits it for beta review (apps/ios/fastlane lane distribute_external).
# A manual run stays internal unless `external` is set. The former daily 09:00 KST schedule is gone: every main merge now ships.
on:
  push:
    branches: [main]
    paths: [apps/ios/**, shared/assets/**, .github/workflows/ios-testflight.yml]
  workflow_dispatch:
    inputs:
      external:
        description: Also distribute to the external TestFlight group (var TESTFLIGHT_EXTERNAL_GROUP, default 비공개 테스터) and submit for beta review
        type: boolean
        default: false
      changelog:
        description: TestFlight "What to Test" for external testers (empty = last commit subject)
        type: string
        default: ""
permissions:
  contents: read
  actions: read
# Per event: a main push never cancels a manual run (and vice versa). A second main merge during the processing wait cancels the first
# push run; that build stays internal-only and the newer one goes external.
concurrency:
  group: ios-testflight-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  # Cheap ubuntu gate: a main push whose iOS inputs match the last successful push run never starts a macOS runner
  # (safety net behind `on.push.paths`; manual runs always build).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != push ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Only earlier push runs count: a manual internal build on the same commit must not keep testers from getting it.
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ios-testflight.yml --event push --branch "$GITHUB_REF_NAME" --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null \
            || git diff --name-only "$last" HEAD | grep -qE '^(apps/ios/|shared/assets/|\.github/workflows/ios-testflight\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No iOS changes since $last; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi
  testflight:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-26
    # Archive + upload take about 20 minutes; `external` then waits up to 40 minutes for App Store Connect processing.
    timeout-minutes: 100
    env:
      # Origins come from repository variables; credentials from repository secrets. Nothing lives in the repo.
      DEARBY_API_ORIGIN: ${{ vars.DEARBY_API_ORIGIN }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Manual signing: the Apple Distribution certificate (p12) and an App Store profile
      # (created via the App Store Connect API, Associated Domains included) come from secrets.
      # Automatic signing on a fresh runner falls back to cloud signing, which the API key may not allow.
      - name: Install signing material
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          # 행사 당일 진행 중 표시 (native-v1.md 2026-10-26): the App Store profile of the DearbyWidgets extension (io.wid.dearby.widgets). Optional:
          # without it generate_project.rb leaves the extension out and the build ships without the Live Activity.
          PROFILE_WIDGETS: ${{ secrets.IOS_APPSTORE_PROFILE_WIDGETS_BASE64 }}
        run: |
          for v in DEARBY_API_ORIGIN TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 DIST_P12 PROFILE; do
            test -n "${!v}" || { echo "missing $v"; exit 1; }
          done
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$key" && chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
          kc="$RUNNER_TEMP/signing.keychain-db"; pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$kc" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/appstore.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          name=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"; mkdir -p "$dir"
          cp "$RUNNER_TEMP/appstore.mobileprovision" "$dir/$uuid.mobileprovision"
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"
          if [ -n "$PROFILE_WIDGETS" ]; then
            printf '%s' "$PROFILE_WIDGETS" | base64 --decode > "$RUNNER_TEMP/widgets.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/widgets.mobileprovision" > "$RUNNER_TEMP/widgets-profile.plist"
            wuuid=$(plutil -extract UUID raw "$RUNNER_TEMP/widgets-profile.plist")
            wname=$(plutil -extract Name raw "$RUNNER_TEMP/widgets-profile.plist")
            cp "$RUNNER_TEMP/widgets.mobileprovision" "$dir/$wuuid.mobileprovision"
            echo "PROFILE_WIDGETS_NAME=$wname" >> "$GITHUB_ENV"
          else
            echo "::warning::IOS_APPSTORE_PROFILE_WIDGETS_BASE64 is not set; this build has no Live Activity (DearbyWidgets left out)"
          fi
      # 사용 통계 (analytics-v1.md): the Firebase config comes from an optional secret; without it the app builds with Analytics off.
      - name: Firebase config
        env:
          PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$PLIST" ]; then
            mkdir -p Config && printf '%s' "$PLIST" | base64 --decode > Config/GoogleService-Info.plist
            echo "Firebase config written"
          else
            echo "No IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64; building without Analytics"
          fi
      # 맞춤 대기열 끝 광고 (AdMob): repository variables; without both the build leaves the ad out and never starts the SDK.
      - name: Archive
        env:
          ADMOB_IOS_APP_ID: ${{ vars.ADMOB_IOS_APP_ID }}
          ADMOB_IOS_QUEUE_NATIVE_UNIT_ID: ${{ vars.ADMOB_IOS_QUEUE_NATIVE_UNIT_ID }}
        run: |
          if [ -z "$ADMOB_IOS_APP_ID" ] || [ -z "$ADMOB_IOS_QUEUE_NATIVE_UNIT_ID" ]; then
            echo "::warning::ADMOB_IOS_APP_ID or ADMOB_IOS_QUEUE_NATIVE_UNIT_ID is not set; this build has no queue ad"
          fi
          # The Xcode project is generated, not tracked.
          gem install --user-install --no-document xcodeproj
          DEARBY_RELEASE_PROFILE="$PROFILE_NAME" DEARBY_RELEASE_PROFILE_WIDGETS="${PROFILE_WIDGETS_NAME:-}" DEARBY_TEAM_ID="$TEAM_ID" ruby scripts/generate_project.rb
          # Monotonic build number above the manual uploads (1, 2); re-runs get a new suffix.
          build="$((GITHUB_RUN_NUMBER + 2)).$GITHUB_RUN_ATTEMPT"
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          # Same source as ios-appstore-submit.yml: the marketing version the build carries.
          echo "APP_VERSION=$(sed -n "s/.*'MARKETING_VERSION' => '\([^']*\)'.*/\1/p" scripts/generate_project.rb | head -n 1)" >> "$GITHUB_ENV"
          xcodebuild -project Dearby.xcodeproj -scheme Dearby -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Dearby.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$build" archive
      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>provisioningProfiles</key><dict><key>io.wid.dearby</key><string>$PROFILE_NAME</string>${PROFILE_WIDGETS_NAME:+<key>io.wid.dearby.widgets</key><string>$PROFILE_WIDGETS_NAME</string>}</dict>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Dearby.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build $APP_VERSION ($BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"
      # External testers (every main push, or `external`): Beta App Review Information and the group's Test Information must already be
      # saved in App Store Connect (entered once in the console; fastlane sends neither). Each external build is submitted for TestFlight beta review.
      - if: github.event_name == 'push' || inputs.external == true
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/ios
      - name: Distribute to external testers
        if: github.event_name == 'push' || inputs.external == true
        env:
          TESTFLIGHT_EXTERNAL_GROUP: ${{ vars.TESTFLIGHT_EXTERNAL_GROUP || '비공개 테스터' }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          # Push runs have no input: the merge commit subject, or a plain fallback.
          CHANGELOG=${CHANGELOG:-$(git log -1 --format=%s)}
          CHANGELOG=${CHANGELOG:-업데이트}
          CHANGELOG="$CHANGELOG" bundle exec fastlane ios distribute_external
          echo "Distributed to TestFlight group \"$TESTFLIGHT_EXTERNAL_GROUP\" and submitted for beta review" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP"/*profile.plist Config/GoogleService-Info.plist
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

name: iOS TestFlight
on:
  # Daily 09:00 KST, only when iOS inputs changed since the last successful upload; or on demand.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-testflight
  cancel-in-progress: true
jobs:
  # Cheap ubuntu gate so a scheduled day without iOS changes never starts a macOS runner.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != schedule ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ios-testflight.yml --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ -z "$last" ] || git diff --name-only "$last" HEAD | grep -qE '^(apps/ios/|shared/assets/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No iOS changes since $last; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi
  testflight:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Origins come from repository variables; credentials from repository secrets. Nothing lives in the repo.
      DEARBY_API_ORIGIN: ${{ vars.DEARBY_API_ORIGIN }}
      DEARBY_WEB_ORIGIN: ${{ vars.DEARBY_WEB_ORIGIN }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Manual signing: the Apple Distribution certificate (p12) and an App Store profile
      # (created via the App Store Connect API, Associated Domains included) come from secrets.
      # Automatic signing on a fresh runner falls back to cloud signing, which the API key may not allow.
      - name: Install signing material
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          for v in DEARBY_API_ORIGIN DEARBY_WEB_ORIGIN TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 DIST_P12 PROFILE; do
            test -n "${!v}" || { echo "missing $v"; exit 1; }
          done
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$key" && chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
          kc="$RUNNER_TEMP/signing.keychain-db"; pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$kc" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/appstore.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          name=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"; mkdir -p "$dir"
          cp "$RUNNER_TEMP/appstore.mobileprovision" "$dir/$uuid.mobileprovision"
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"
      - name: Archive
        run: |
          # The Xcode project is generated, not tracked.
          gem install --user-install --no-document xcodeproj
          ruby scripts/generate_project.rb
          # Monotonic build number above the manual uploads (1, 2); re-runs get a new suffix.
          build="$((GITHUB_RUN_NUMBER + 2)).$GITHUB_RUN_ATTEMPT"
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          xcodebuild -project Dearby.xcodeproj -scheme Dearby -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Dearby.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CURRENT_PROJECT_VERSION="$build" archive
      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>provisioningProfiles</key><dict><key>io.wid.dearby</key><string>$PROFILE_NAME</string></dict>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Dearby.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/appstore.mobileprovision "$RUNNER_TEMP"/profile.plist
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

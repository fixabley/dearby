name: Native verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
      supabase: ${{ steps.diff.outputs.supabase }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # The macOS runner is scarce; run the iOS job only when iOS inputs change.
      # A job skipped by its `if` still satisfies the required "iOS build" check.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo "ios=true" >> "$GITHUB_OUTPUT"; echo "supabase=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "$BASE" HEAD)
          if echo "$changed" | grep -qE '^(apps/ios/|shared/assets/|\.github/workflows/native\.yml$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(supabase/|\.github/workflows/native\.yml$)'; then
            echo "supabase=true" >> "$GITHUB_OUTPUT"
          else
            echo "supabase=false" >> "$GITHUB_OUTPUT"
          fi
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dearby-api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/dearby-api/.nvmrc
          cache: npm
          cache-dependency-path: apps/dearby-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
  # Replays every migration in version order on a fresh Supabase Postgres.
  # Fixture-only database; never pointed at the cloud project.
  supabase-sql:
    name: Supabase migrations
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.supabase == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.6.1.171
        env:
          POSTGRES_PASSWORD: fixture-only-password
          JWT_SECRET: fixture-only-jwt-secret-at-least-32-characters
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: fixture-only-password
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Apply migrations
        run: for f in supabase/migrations/*.sql; do echo "$f"; psql -X -q -v ON_ERROR_STOP=1 -f "$f"; done
  catalog-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/catalog-worker
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run check
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 scripts/check-fsd.py
      - run: ./gradlew --no-daemon lintDebug assembleDebug
  ios:
    name: iOS build
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.ios == 'true')
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record toolchain
        run: xcodebuild -version
      - name: Swift style
        run: |
          bash scripts/setup_swiftlint.sh
          bash scripts/run_swiftlint.sh
      # The Xcode project is generated, not tracked (avoids merge conflicts on project.pbxproj).
      - name: Generate Xcode project
        run: |
          gem install --user-install --no-document xcodeproj
          ruby scripts/generate_project.rb
      - name: Build app
        run: xcodebuild -project Dearby.xcodeproj -scheme Dearby -destination 'generic/platform=iOS Simulator' build

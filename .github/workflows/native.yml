name: Native verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # The macOS runner is scarce; run the iOS job only when iOS inputs change.
      # A job skipped by its `if` still satisfies the required "iOS architecture" check.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo "ios=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(apps/ios/|shared/assets/|\.github/workflows/native\.yml$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.6.1.171
        env:
          POSTGRES_PASSWORD: fixture-only-password
          JWT_SECRET: fixture-only-jwt-secret-at-least-32-characters
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PG_TEST_ADMIN_URL: postgresql://postgres:fixture-only-password@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: apps/dearby-api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/dearby-api/.nvmrc
          cache: npm
          cache-dependency-path: apps/dearby-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  catalog-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/catalog-worker
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run check
      - run: npm test
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 scripts/check-fsd.py
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
  ios:
    name: iOS architecture
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.ios == 'true')
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record toolchain
        run: xcodebuild -version
      - name: Swift style and architecture checks
        run: |
          bash scripts/setup_swiftlint.sh
          bash tests/run_swiftlint.sh
          bash tests/run_architecture.sh
      - name: Select available iPhone simulator
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          echo "DEARBY_SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
      # Large-text test paused by user request (2026-10-06) until asked again.
      - name: Build and test
        run: xcodebuild -project Dearby.xcodeproj -scheme Dearby -destination "platform=iOS Simulator,id=$DEARBY_SIMULATOR_ID" -parallel-testing-enabled NO test -skip-testing:DearbyUITests/DiscoveryNavigationTests/testAccessibilityTextCalendarAndWalletRemainUsable

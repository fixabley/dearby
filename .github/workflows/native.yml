name: Native verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
      android: ${{ steps.diff.outputs.android }}
      api: ${{ steps.diff.outputs.api }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # The macOS runner is scarce; run the iOS job only when iOS inputs change.
      # A job skipped by its `if` still satisfies the required "iOS build" check.
      # The Android build takes minutes, so it also runs only when Android inputs change.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo "ios=true" >> "$GITHUB_OUTPUT"; echo "android=true" >> "$GITHUB_OUTPUT"; echo "api=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "$BASE" HEAD)
          if echo "$changed" | grep -qE '^(apps/ios/|shared/assets/|\.github/workflows/native\.yml$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(apps/android/|\.github/workflows/native\.yml$)'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(apps/dearby-api/|\.github/workflows/native\.yml$)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi
  android:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.android == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # Caches the Gradle distribution, dependencies and build cache; only main writes the cache.
      - uses: gradle/actions/setup-gradle@v6
      - run: python3 scripts/check-fsd.py
      # 새 모집 푸시: Firebase config from the optional secret ANDROID_GOOGLE_SERVICES_JSON (file content); without it the build has no push.
      - name: Write google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
      - run: ./gradlew lintDebug assembleDebug
  # Kotlin API: tests on PostgreSQL, plus a check that the committed jOOQ code matches the migrations.
  api:
    name: API test
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.api == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dearby-api
    # Same database as compose.yaml postgres-test.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: dearby_test
          POSTGRES_USER: dearby_test
          POSTGRES_PASSWORD: dearby_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dearby_test -d dearby_test"
          --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: jOOQ code matches the migrations
        run: |
          ./gradlew :core:jooqCodegen
          git diff --exit-code -- core/src/generated || { echo "Run ./gradlew :core:jooqCodegen and commit core/src/generated"; exit 1; }
          test -z "$(git status --porcelain -- core/src/generated)" || { git status --porcelain -- core/src/generated; echo "Untracked generated files; commit core/src/generated"; exit 1; }
      - run: ./gradlew test
  ios:
    name: iOS build
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.ios == 'true')
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record toolchain
        run: xcodebuild -version
      - name: Swift style
        run: |
          bash scripts/setup_swiftlint.sh
          bash scripts/run_swiftlint.sh
      # 사용 통계 (analytics-v1.md): the Firebase config comes from an optional secret; without it the app builds with Analytics off.
      - name: Firebase config
        env:
          PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$PLIST" ]; then
            mkdir -p Config && printf '%s' "$PLIST" | base64 --decode > Config/GoogleService-Info.plist
            echo "Firebase config written"
          else
            echo "No IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64; building without Analytics"
          fi
      # The Xcode project is generated, not tracked (avoids merge conflicts on project.pbxproj).
      # 맞춤 대기열 끝 광고: this Debug build uses Google's test IDs; the variables only matter to Release (ios-testflight.yml), so only warn here.
      - name: Generate Xcode project
        env:
          ADMOB_IOS_APP_ID: ${{ vars.ADMOB_IOS_APP_ID }}
          ADMOB_IOS_QUEUE_NATIVE_UNIT_ID: ${{ vars.ADMOB_IOS_QUEUE_NATIVE_UNIT_ID }}
        run: |
          if [ -z "$ADMOB_IOS_APP_ID" ] || [ -z "$ADMOB_IOS_QUEUE_NATIVE_UNIT_ID" ]; then
            echo "::warning::ADMOB_IOS_APP_ID or ADMOB_IOS_QUEUE_NATIVE_UNIT_ID is not set; Release builds leave out the queue ad"
          fi
          gem install --user-install --no-document xcodeproj
          ruby scripts/generate_project.rb
      - name: Build app
        run: xcodebuild -project Dearby.xcodeproj -scheme Dearby -destination 'generic/platform=iOS Simulator' build

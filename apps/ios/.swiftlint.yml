# Project-owned Swift source and tests; dependency/generated/build trees are not app code.
included:
  - Sources
  - unitTests
  - uiTests
  - tests
excluded:
  - tests/ArchitectureTests/.build
  - tests/ArchitectureTests/.swiftpm

# Explicit, versioned initial policy: correctness and local readability.
# FSD paths/dependencies/public APIs remain the architecture gate's responsibility.
only_rules:
  - blanket_disable_command
  - block_based_kvo
  - class_delegate_protocol
  - closing_brace
  - colon
  - comma
  - compiler_protocol_init
  - computed_accessors_order
  - control_statement
  - deployment_target
  - discarded_notification_center_observer
  - duplicate_conditions
  - duplicate_enum_cases
  - duplicate_imports
  - empty_enum_arguments
  - empty_parameters
  - empty_parentheses_with_trailing_closure
  - for_where
  - force_cast
  - force_try
  - generic_type_name
  - implicit_getter
  - inclusive_language
  - invalid_swiftlint_command
  - leading_whitespace
  - legacy_cggeometry_functions
  - legacy_constant
  - legacy_constructor
  - legacy_hashing
  - legacy_nsgeometry_functions
  - mark
  - no_fallthrough_only
  - no_space_in_method_call
  - notification_center_detachment
  - nsobject_prefer_isequal
  - private_unit_test
  - protocol_property_accessors_order
  - redundant_discardable_let
  - redundant_objc_attribute
  - redundant_set_access_control
  - redundant_string_enum_value
  - redundant_void_return
  - return_arrow_whitespace
  - self_in_property_initialization
  - shorthand_operator
  - statement_position
  - superfluous_disable_command
  - syntactic_sugar
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - unavailable_condition
  - unneeded_break_in_switch
  - unused_closure_parameter
  - unused_control_flow_label
  - unused_enumerated
  - unused_optional_binding
  - valid_ibinspectable
  - vertical_parameter_alignment
  - vertical_whitespace
  - void_return

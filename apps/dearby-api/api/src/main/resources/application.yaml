spring:
  application:
    name: dearby-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  threads:
    virtual:
      enabled: true

dearby:
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID}
    rp-name: Dearby
    allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS} # 쉼표로 구분
  # 애플 로그인. APPLE_CLIENT_IDS가 비어 있으면 /v1/auth/apple/*는 503(native-v1.md "애플 로그인")
  apple:
    client-ids: ${APPLE_CLIENT_IDS:} # 쉼표로 구분: iOS 번들 ID, Services ID
    services-id: ${APPLE_SERVICES_ID:}
    callback-url: ${APPLE_CALLBACK_URL:}
    # 계정 삭제 때 애플 토큰 폐기(.p8 키). 없으면 토큰을 받지도 폐기하지도 않는다
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key-path: ${APPLE_PRIVATE_KEY_PATH:}
  jwt:
    key-path: ${JWT_KEY_PATH}
    issuer: ${JWT_ISSUER}
    access-token-ttl: 1m
    refresh-token-ttl: 90d

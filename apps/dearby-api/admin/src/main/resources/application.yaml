spring:
  application:
    name: dearby-admin
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 2MB # 프로그램 로고(admin-v1.md "프로그램 로고"). 1MB 제한은 서비스가 본다
      max-request-size: 3MB

# 공통 인증(auth 모듈) 설정. api와 같은 값이어야 같은 토큰·패스키를 쓴다(서명 키 파일도 같은 것)
dearby:
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID}
    rp-name: Dearby
    allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS} # 쉼표로 구분
  # 어드민 장소 검색(admin-v1.md "활동 장소와 지오코딩"): 카카오 REST API 키. 비어 있으면 Nominatim(OpenStreetMap)을 쓴다
  geocode:
    kakao-key: ${KAKAO_REST_API_KEY:}
  jwt:
    key-path: ${JWT_KEY_PATH}
    issuer: ${JWT_ISSUER}
    access-token-ttl: 1m
    refresh-token-ttl: 90d

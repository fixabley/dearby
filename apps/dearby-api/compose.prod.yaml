# 운영용: API + 관리자 API + 수집 배치 + DB. 실행: docker compose -f compose.prod.yaml --env-file .env.prod up -d --build
# API와 DB 모두 127.0.0.1에만 연다. API는 앞단 nginx가 프록시하고, DB 포트는 이 서버에서 IntelliJ 등으로 직접 볼 때 쓴다. 데이터는 ./data/prod 아래에 남는다
name: dearby-api-prod

services:
  postgres:
    # PostgreSQL 17 + pgvector(임베딩 검색 대비, 2026-10-14). Debian 기반이라 alpine 이미지의 데이터 폴더와 정렬 규칙이 달라 새로 초기화했다
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?}
      POSTGRES_USER: ${DB_USERNAME:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - ./data/prod/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PUBLISH_PORT:?}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?}
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      JWT_KEY_PATH: /app/data/jwt/private.pem
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?}
      WEBAUTHN_ALLOWED_ORIGINS: ${WEBAUTHN_ALLOWED_ORIGINS:?}
      JWT_ISSUER: ${JWT_ISSUER:?}
      # 애플 로그인(선택). 비어 있으면 애플 로그인만 503
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-}
      APPLE_SERVICES_ID: ${APPLE_SERVICES_ID:-}
      APPLE_CALLBACK_URL: ${APPLE_CALLBACK_URL:-}
      # 계정 삭제 때 애플 토큰 폐기. 키 파일은 data/prod/apple/AuthKey.p8(저장소에 넣지 않는다)
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY_PATH: ${APPLE_PRIVATE_KEY_PATH:-}
      # 구글 로그인(선택, 웹 방식). 셋 중 하나라도 비어 있으면 구글 로그인만 503
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      # 개인정보 동의 문서 버전(선택, 기본 처리방침 2026-10-26·약관 2026-10-22). 웹 /privacy·/terms를 바꾸면 올린다
      CONSENT_PRIVACY_VERSION: ${CONSENT_PRIVACY_VERSION:-2026-10-26} # 비우면 빈 문자열이 application.yaml 기본값을 덮어써 동의가 항상 400이 된다
      CONSENT_TERMS_VERSION: ${CONSENT_TERMS_VERSION:-2026-10-22}
      # 웹 비로그인 저장 프록시 키(Vercel의 GUEST_PROXY_SECRET과 같은 값). 비어 있으면 /v1/guest/*만 503
      GUEST_PROXY_SECRET: ${GUEST_PROXY_SECRET:-}
      # 연락처 인증(선택, native-v1.md "연락처 인증"). GitHub 셋 중 하나라도 비면 GitHub 연결만, MAIL_HOST·MAIL_FROM이 비면 이메일 인증만 503
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      # 컨테이너는 uid 10001로 실행된다. Linux 호스트는 첫 실행 전에 소유자를 맞춘다:
      # mkdir -p data/prod/jwt && sudo chown 10001 data/prod/jwt
      - ./data/prod/jwt:/app/data/jwt
      - ./data/prod/apple:/app/data/apple:ro
    ports:
      - "127.0.0.1:${API_PORT:?}:8080"

  # 활동 수집(Spring Batch). 매일 한국 시간 자정에 켜진 수집 설정을 수집해 초안으로 저장한다.
  # Claude Code CLI(구독)로 수집하며 CLAUDE_CODE_OAUTH_TOKEN(claude setup-token)을 쓴다. 없으면 실행하지 않고 경고만 남긴다.
  # 바로 한 번 돌리려면: docker compose ... run --rm batch --collect-now
  # 수집 뒤 맞춤 대기열(native-v1.md "맞춤 대기열"): 로고 대표색 → 활동·태그 임베딩(바뀐 것만) → 사용자 대기열. 대기열만: run --rm batch --build-queues-now, 게시 활동 빈 대기열 글 채우기: run --rm batch --backfill-hooks-now, 즐겨찾기 알림 지금: run --rm batch --send-push-now
  # 위 일회성 옵션(--import-curation 포함)으로 띄운 run --rm 컨테이너는 @Scheduled 정기 작업을 켜지 않는다(2026-10-26). 옵션 없이 뜨는 상시 batch만 스케줄을 돈다
  # 임베딩 모델은 이미지 빌드 때 고정 판을 ONNX로 바꿔 넣는다(이미지 약 740MB 추가, 임베딩 중 메모리 약 2.2GB, 활동 300개 약 2.5분). 외부 API를 부르지 않는다
  batch:
    build:
      context: .
      dockerfile: batch/Dockerfile
      args:
        EMBEDDING_VARIANT: ${EMBEDDING_VARIANT:-int8} # fp32로 바꾸면 EMBEDDING_MODEL_ID도 …:fp32로
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?}
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # 수집 에이전트 작업 절차(2026-10-20). 서버의 ./data/prod/collector/WORKFLOW.md를 고치면 이미지를 다시 만들지 않고 다음 수집부터 쓴다. 파일이 없으면 jar 안의 기본 파일
      COLLECTION_WORKFLOW_PATH: /app/data/collector/WORKFLOW.md
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-} # 수집기 장소 지오코딩(native-v1.md "수집기 장소"). 비어 있으면 Nominatim
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-nlpai-lab/KURE-v1@8b418a5:int8} # 벡터와 함께 저장되는 모델 id. 모델·판을 바꾸면 함께 바꾼다
      # 즐겨찾기 푸시 알림(native-v1.md "푸시 알림"): 매시 정각에 기기 시간대가 8시인 기기로 보낸다. 지금 한 번: run --rm batch --send-push-now
      # 인증 정보가 비어 있으면 발송만 건너뛴다. APNS_KEY_P8은 PEM 내용 또는 /app/data/apns/AuthKey.p8 같은 경로
      APNS_KEY_P8: ${APNS_KEY_P8:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-io.wid.dearby}
      APNS_ENV: ${APNS_ENV:-production}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH:-}
    volumes:
      - ./data/prod/collector/WORKFLOW.md:/app/data/collector/WORKFLOW.md:ro
      - ./data/prod/apns:/app/data/apns:ro # APNs .p8(APNS_KEY_P8=/app/data/apns/AuthKey.p8로 쓸 때)
      - ./data/prod/fcm:/app/data/fcm:ro # FCM 서비스 계정 JSON(FCM_CREDENTIALS_PATH=/app/data/fcm/service-account.json). 폴더가 없으면 빈 폴더로 붙는다

  # 관리자 API(shared/contracts/admin-v1.md). nginx가 api.dearby.wid.io.kr/v1/admin/ 을 이 포트로 보낸다.
  # 공통 인증(auth 모듈)을 쓰므로 api와 같은 서명 키(읽기 전용)·패스키 설정을 쓴다
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?}
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      JWT_KEY_PATH: /app/data/jwt/private.pem
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?}
      WEBAUTHN_ALLOWED_ORIGINS: ${WEBAUTHN_ALLOWED_ORIGINS:?}
      JWT_ISSUER: ${JWT_ISSUER:?}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-} # 어드민 장소 검색. 비어 있으면 Nominatim
    volumes:
      - ./data/prod/jwt:/app/data/jwt:ro
    ports:
      - "127.0.0.1:${ADMIN_PORT:-58868}:8080"

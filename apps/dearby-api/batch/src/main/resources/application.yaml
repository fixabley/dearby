spring:
  application:
    name: dearby-batch
  main:
    web-application-type: none
    keep-alive: true # 스케줄러만 도는 앱이라 할 일이 없어도 내려가지 않게
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  batch:
    job:
      enabled: false # 기동 때 잡을 자동 실행하지 않는다(CollectionLauncher가 실행)
    jdbc:
      initialize-schema: never # Spring Batch 테이블은 core 마이그레이션(V9)이 만든다
  threads:
    virtual:
      enabled: true

dearby:
  collection:
    model: claude-haiku-4-5
    workflow-path: ${COLLECTION_WORKFLOW_PATH:} # 작업 절차 파일. 비었거나 파일이 없으면 jar 안의 collector/WORKFLOW.md
  # 수집기 장소 지오코딩(native-v1.md "수집기 장소"): 카카오 REST API 키. 비어 있으면 Nominatim(OpenStreetMap)
  geocode:
    kakao-key: ${KAKAO_REST_API_KEY:}
  # 활동 벡터(native-v1.md "활동 벡터"): 이미지 안의 ONNX 모델(batch/Dockerfile). 모델·가중치 판을 바꾸면 model-id도 바꾼다(같은 model-id 벡터끼리만 비교)
  embedding:
    model-id: ${EMBEDDING_MODEL_ID:nlpai-lab/KURE-v1@8b418a5:int8}
    model-dir: ${EMBEDDING_MODEL_DIR:/app/models/kure-v1}
    model-file: ${EMBEDDING_MODEL_FILE:model.onnx}
    max-tokens: ${EMBEDDING_MAX_TOKENS:8192}
    threads: ${EMBEDDING_THREADS:4}
  # 즐겨찾기 푸시 알림(native-v1.md "푸시 알림"): 인증 정보는 운영 .env.prod에만. 비어 있으면 그 플랫폼 발송만 건너뛴다(로그 한 줄)
  push:
    apns-key-p8: ${APNS_KEY_P8:}
    apns-key-id: ${APNS_KEY_ID:}
    apns-team-id: ${APNS_TEAM_ID:}
    apns-topic: ${APNS_TOPIC:io.wid.dearby}
    apns-env: ${APNS_ENV:production}
    fcm-project-id: ${FCM_PROJECT_ID:}
    fcm-credentials-path: ${FCM_CREDENTIALS_PATH:}

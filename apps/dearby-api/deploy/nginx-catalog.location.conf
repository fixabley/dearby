# ROOT ONLY: insert inside the EXISTING wid.io.kr HTTPS server block.
# Do not load this as a standalone conf.d file (locations require a server).
location = /v1/catalog {
    # Exact public read surface; query strings do not select another route.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://host.docker.internal:58865;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
    proxy_send_timeout 12s;
    proxy_hide_header X-Powered-By;
}
location = /v1 { access_log off; error_log /dev/null crit; return 404; }
location ^~ /v1/ { access_log off; error_log /dev/null crit; return 404; }

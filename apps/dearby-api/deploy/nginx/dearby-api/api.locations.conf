# Public API surface shared by the wid.io.kr and api.dearby.wid.io.kr HTTPS servers.
# Lives in conf.d/dearby-api/ so the conf.d/*.conf glob never loads it as a standalone file.
# Member routes (/v1/auth/*, /v1/profile, /v1/cards collection, /v1/wallet, /v1/exchanges) stay 404 here.

# Read-only API reference.
location = /docs {
    access_log off;
    error_log /dev/null crit;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    return 308 /docs/;
}
location ^~ /docs/ {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://host.docker.internal:58865;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Guest-Token "";
    proxy_set_header X-Guest-Proxy-Key "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
    proxy_send_timeout 12s;
}

# Exact public read surface; query strings do not select another route.
location = /v1/catalog {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://host.docker.internal:58865;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Guest-Token "";
    proxy_set_header X-Guest-Proxy-Key "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
    proxy_send_timeout 12s;
    proxy_hide_header X-Powered-By;
}

# STAGE (#88): keep commented out until main approves opening member routes. Must stay ABOVE the public card regex:
# regex locations match in order, and the member card location also serves DELETE /v1/cards/:id.
# include /etc/nginx/conf.d/dearby-api/member.locations.conf;

# Public card and share snapshots only; never the /v1/cards collection, share creation or private profile.
location ~ "^/v1/(cards|shares)/[0-9a-fA-F-]{36}$" {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://host.docker.internal:58865;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Guest-Token "";
    proxy_set_header X-Guest-Proxy-Key "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
}

# Guest proxy paths. The API enforces each route's exact method plus the server-only proxy secret.
location ~ "^/v1/guest/(cards(?:/[0-9a-fA-F-]{36})?|shares/[0-9a-fA-F-]{36}|session)$" {
    if ($request_method !~ ^(GET|HEAD|PUT|DELETE)$) { return 405; }
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://host.docker.internal:58865;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Guest-Proxy-Key $http_x_guest_proxy_key;
    proxy_set_header X-Guest-Token $http_x_guest_token;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
}

# STAGE 2: keep this line commented out until the API image with the handoff routes (PR #110) is deployed.
# include /etc/nginx/conf.d/dearby-api/handoff.locations.conf;

location = /v1 { access_log off; error_log /dev/null crit; return 404; }
location /v1/ { access_log off; error_log /dev/null crit; return 404; }

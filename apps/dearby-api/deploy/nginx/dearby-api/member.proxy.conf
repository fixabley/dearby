# Shared by every member location: forward the owner bearer token only here; never cookies or guest headers.
access_log off;
error_log /dev/null crit;
client_max_body_size 64k;
proxy_pass http://host.docker.internal:58865;
proxy_set_header Host $host;
proxy_set_header Authorization $http_authorization;
proxy_set_header Cookie "";
proxy_set_header X-Guest-Token "";
proxy_set_header X-Guest-Proxy-Key "";
# Overwrite, never append: a client-supplied X-Forwarded-For must not survive this hop.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 3s;
# Code requests send mail synchronously (SMTP timeouts up to 25s).
proxy_read_timeout 30s;

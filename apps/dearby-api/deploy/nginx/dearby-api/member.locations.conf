# STAGE: member routes (native-v1 login, profile, card publishing/sharing, wallet). Included from api.locations.conf
# BEFORE the public card regex, so DELETE /v1/cards/:id reaches the API with its bearer token.
# Paths are exact; each allows only its contract methods (HEAD follows GET). Everything else under /v1 stays 404.

# Code requests send mail and are the costly abuse target (SMTP account quota).
location = /v1/auth/challenges {
    if ($request_method != POST) { return 405; }
    limit_req zone=dearby_auth_challenges burst=5 nodelay;
    limit_req_status 429;
    error_page 429 = @dearby_rate_limited;
    include /etc/nginx/conf.d/dearby-api/member.proxy.conf;
}
location = /v1/auth/sessions {
    if ($request_method != POST) { return 405; }
    include /etc/nginx/conf.d/dearby-api/member.proxy.conf;
}
location = /v1/auth/session {
    if ($request_method != DELETE) { return 405; }
    include /etc/nginx/conf.d/dearby-api/member.proxy.conf;
}
location = /v1/profile {
    if ($request_method !~ ^(GET|HEAD|PUT)$) { return 405; }
    include /etc/nginx/conf.d/dearby-api/member.proxy.conf;
}
location = /v1/cards {
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
    include /etc/nginx/conf.d/dearby-api/member.proxy.conf;
}
# Public GET/HEAD of a card stays anonymous at the API (it ignores the token there); DELETE is the owner's withdrawal.
location ~ "^/v1/cards/[0-9a-fA-F-]{36}$" {
    if ($request_method !~ ^(GET|HEAD|DELETE)$) { return 405; }
    include /etc/nginx/conf.d/dearby-api/member.proxy.conf;
}
location ~ "^/v1/cards/[0-9a-fA-F-]{36}/shares$" {
    if ($request_method != POST) { return 405; }
    include /etc/nginx/conf.d/dearby-api/member.proxy.conf;
}
location = /v1/wallet {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    include /etc/nginx/conf.d/dearby-api/member.proxy.conf;
}
location = /v1/wallet/import {
    if ($request_method != POST) { return 405; }
    include /etc/nginx/conf.d/dearby-api/member.proxy.conf;
}
# Same error envelope as the API, so apps handle nginx and API rate limits alike.
location @dearby_rate_limited {
    default_type application/json;
    add_header Cache-Control no-store always;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"Try again later"}}';
}

# ROOT ONLY: REPLACE the old catalog-only snippet inside the wid.io.kr HTTPS server.
# In particular remove its old `location ^~ /v1/` so these regex routes can match.
# Do not load this as a standalone conf.d file (locations require a server).
location = /v1/catalog {
    # Exact public read surface; query strings do not select another route.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://host.docker.internal:58865;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
    proxy_send_timeout 12s;
    proxy_hide_header X-Powered-By;
}
# Public snapshots only; never /v1/cards collection or private profile.
location ~ "^/v1/cards/[0-9a-fA-F-]{36}$" {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://host.docker.internal:58865;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Guest-Token "";
    proxy_set_header X-Guest-Proxy-Key "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
}
# The API enforces each route's exact method plus the server-only proxy secret.
location ~ "^/v1/guest/(cards(?:/[0-9a-fA-F-]{36})?|session)$" {
    if ($request_method !~ ^(GET|HEAD|PUT|DELETE)$) { return 405; }
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://host.docker.internal:58865;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Guest-Proxy-Key $http_x_guest_proxy_key;
    proxy_set_header X-Guest-Token $http_x_guest_token;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
}
location = /v1 { access_log off; error_log /dev/null crit; return 404; }
location /v1/ { access_log off; error_log /dev/null crit; return 404; }

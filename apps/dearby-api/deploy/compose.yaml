name: dearby-api-main
services:
  api:
    image: dearby-api-main:local
    build:
      context: ../../..
      dockerfile: apps/dearby-api/deploy/Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env.runtime
    ports:
      - "127.0.0.1:58865:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - data:/data:ro
      - type: bind
        source: ${DEARBY_DATABASE_CA_FILE:?Set external Supabase CA path}
        target: /run/secrets/database-ca.crt
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/v1/catalog').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
volumes:
  data:

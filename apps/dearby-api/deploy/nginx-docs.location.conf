# Root-reviewed additive locations INSIDE the wid.io.kr HTTPS server.
# Documentation only; the existing /v1 route allowlist remains unchanged.
location = /docs {
    access_log off;
    error_log /dev/null crit;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    return 308 /docs/;
}
location ^~ /docs/ {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://host.docker.internal:58865;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Guest-Token "";
    proxy_set_header X-Guest-Proxy-Key "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
    proxy_send_timeout 12s;
}

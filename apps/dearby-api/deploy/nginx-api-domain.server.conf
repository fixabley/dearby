# ROOT ONLY: dedicated API host api.dearby.wid.io.kr. Example for review; apply only with the steps in deploy/README.md.
# Place this file in conf.d (it contains whole server blocks) and copy the two location snippets into
# conf.d/dearby-api/ so the conf.d/*.conf glob does not load them as standalone files.
# The API surface is exactly the existing wid.io.kr snippets: catalog, public card reads, guest proxy paths, /docs.
# The wid.io.kr locations stay unchanged during the transition.
server {
    listen 80;
    listen [::]:80;
    server_name api.dearby.wid.io.kr;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://api.dearby.wid.io.kr$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.dearby.wid.io.kr;
    # Uses the http-level ssl_certificate; that certificate must list api.dearby.wid.io.kr as a SAN first.
    include /etc/nginx/conf.d/dearby-api/nginx-web-guest.location.conf;
    include /etc/nginx/conf.d/dearby-api/nginx-docs.location.conf;
    location / { access_log off; error_log /dev/null crit; return 404; }
}

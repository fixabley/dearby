# 테스트 DB: H2를 PostgreSQL 호환 모드로. VALUE는 H2 예약어라 contacts.value 컬럼을 위해 해제
spring.datasource.url=jdbc:h2:mem:dearby;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
dearby.jwt.key-path=build/test-jwt/private.pem
dearby.webauthn.rp-id=localhost
dearby.webauthn.allowed-origins=http://localhost
dearby.jwt.issuer=http://localhost

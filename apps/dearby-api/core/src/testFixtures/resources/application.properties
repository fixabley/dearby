# 테스트 DB: compose.yaml의 postgres-test(127.0.0.1:5433). CI는 같은 값의 서비스 컨테이너를 띄운다
spring.datasource.url=jdbc:postgresql://localhost:${TEST_DB_PORT:5433}/dearby_test
spring.datasource.username=dearby_test
spring.datasource.password=dearby_test
# 테스트 시작 때 스키마를 비우고 다시 마이그레이션한다(TestDatabaseConfig)
spring.flyway.clean-disabled=false
dearby.jwt.key-path=build/test-jwt/private.pem
dearby.webauthn.rp-id=localhost
dearby.webauthn.allowed-origins=http://localhost
dearby.jwt.issuer=http://localhost
# 게스트 프록시 키(GuestFlowTest). 운영 값과 무관한 테스트용
dearby.guest.proxy-secret=test-guest-proxy-secret-0123456789abcdef
# 연락처 인증(ContactVerificationFlowTest). GitHub 서버는 MockRestServiceServer, 메일 발송기는 목으로 바꾼다. 운영 값과 무관한 테스트용
dearby.github.client-id=test-github-client-id
dearby.github.client-secret=test-github-client-secret
dearby.github.callback-url=https://api.example.test/v1/me/contacts/github/callback
dearby.github.web-redirect-uri=https://web.example.test/profile
dearby.mail.from=Dearby <no-reply@example.test>
